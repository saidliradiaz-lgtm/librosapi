name: CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias con npm ci
        run: npm ci

      - name: Ejecutar pruebas con Jest y Supertest
        run: npm test

  build-and-push:
    name: Construir y publicar imagen Docker en GHCR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Definir etiquetas de imagen con SHA del commit
        id: meta
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          OWNER_LC=$(echo "$GHCR_USERNAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${OWNER_LC}/librosapi"
          IMAGE_TAG="${IMAGE_BASE}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Construir y subir imagen Docker
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${{ steps.meta.outputs.image_tag }}" \
            -t "${{ steps.meta.outputs.image_latest }}" \
            .
          docker push "${{ steps.meta.outputs.image_tag }}"
          docker push "${{ steps.meta.outputs.image_latest }}"

  deploy:
    name: Desplegar en EC2 con verificacion y rollback
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Autorizar temporalmente SSH del runner en EC2
        id: sg_ssh
        env:
          EC2_SG_ID: ${{ secrets.EC2_SG_ID }}
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32"
          sleep 5

      - name: Desplegar contenedor en EC2 y verificar servicio
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "$GHCR_USERNAME" | tr '[:upper:]' '[:lower:]')
          NEW_IMAGE="ghcr.io/${OWNER_LC}/librosapi:${COMMIT_SHA}"

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -i "$HOME/.ssh/deploy_key" "${EC2_USER}@${EC2_HOST}" \
            env NEW_IMAGE="$NEW_IMAGE" \
            GHCR_USER="$GHCR_USERNAME" \
            GHCR_PASS="$GHCR_TOKEN" \
            bash -s << 'EOF'
          set -euo pipefail

          echo "$GHCR_PASS" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          docker pull "$NEW_IMAGE"

          docker rm -f librosapi-prev >/dev/null 2>&1 || true

          if docker ps -a --format '{{.Names}}' | grep -qx 'librosapi'; then
            docker stop librosapi >/dev/null 2>&1 || true
            docker rename librosapi librosapi-prev
          fi

          docker run -d \
            --name librosapi \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            --env-file /opt/librosapi/.env \
            "$NEW_IMAGE" >/dev/null

          HEALTH_OK=0
          LIBROS_OK=0
          for _ in $(seq 1 15); do
            HEALTH_RESP=$(curl -fsS http://127.0.0.1/health 2>/dev/null || true)
            LIBROS_RESP=$(curl -fsS http://127.0.0.1/libros 2>/dev/null || true)
            if echo "$HEALTH_RESP" | grep -q '"ok"' && echo "$LIBROS_RESP" | grep -q '^\['; then
              HEALTH_OK=1
              LIBROS_OK=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTH_OK" -eq 1 ] && [ "$LIBROS_OK" -eq 1 ]; then
            echo "Despliegue verificado correctamente:"
            echo "GET /health -> $HEALTH_RESP"
            echo "GET /libros -> $LIBROS_RESP"
            docker rm -f librosapi-prev >/dev/null 2>&1 || true
            exit 0
          fi

          echo "Fallo la verificacion del nuevo contenedor. Iniciando rollback..."
          docker logs librosapi || true
          docker rm -f librosapi >/dev/null 2>&1 || true

          if docker ps -a --format '{{.Names}}' | grep -qx 'librosapi-prev'; then
            docker rename librosapi-prev librosapi
            docker start librosapi >/dev/null
            echo "Version anterior restaurada correctamente."
          fi

          exit 1
          EOF

      - name: Revocar regla SSH temporal del runner
        if: always() && steps.sg_ssh.outputs.runner_ip != ''
        env:
          EC2_SG_ID: ${{ secrets.EC2_SG_ID }}
          RUNNER_IP: ${{ steps.sg_ssh.outputs.runner_ip }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true
